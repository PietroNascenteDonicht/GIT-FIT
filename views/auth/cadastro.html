<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <script type="module" src="/assets/js/main.js" defer></script>
    <script type="module" type="module" src="/assets/js/auth/cadastro.js" defer></script>
    <link rel="stylesheet" href="/assets/css/cadastro.css">
</head>
<body>
    <main>
        <form class="cadastro" action="">
            <h1>Cadastro</h1>

            <div class="campo">
                <label>Nome</label>
                <input name="nome" type="text" placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label>Email</label>
                <input name="email" type="email" placeholder="Digite seu email">
            </div>

            <div class="campo">
                <label>Senha</label>
                <input name="senha" type="password" placeholder="Digite sua senha">
            </div>

            <div class="campo">
                <label>Confirmar Senha</label>
                <input name="confirmarSenha" type="password" placeholder="Confirme sua senha">
            </div>

            <button type="submit">Cadastrar</button>

            <p>
                Já possui uma conta?
                <a href="/views/auth/login.html">Entrar</a>
            </p>
        </form>
    </main>
</body>
</html>
